# Builds the universal app and runs its self-test on every pull request and on
# main. It's the only check that compiles Sources/: cloud sessions run on
# Linux, where AppKit isn't available.
# Pull requests and pushes to main run only the jobs their files can affect
# (the changes job decides); a tag runs all of them.
# A v* tag runs the same checks, then attaches Decaffeinate-1.0.0.dmg to the
# GitHub Release v1.0.0. The tag can come from git (git tag v1.0.0 && git push
# origin v1.0.0), which creates the release, or from a release published on
# GitHub, which creates the tag and keeps its own title and notes.
# Run manually (Actions > CI > Run workflow), it builds Decaffeinate-dev.dmg as
# an artifact without releasing anything, to check the dmg window before a tag.
name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A skipped job reports as passed, so it still satisfies a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      hooks: ${{ steps.diff.outputs.hooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        timeout-minutes: 2
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A tag, or a base git can't diff against, counts as a change to this
          # file, which runs every job.
          if [[ $GITHUB_REF == refs/tags/v* ]] || ! files=$(git diff --name-only "$BASE" HEAD); then
            files=.github/workflows/ci.yml
          fi
          echo "$files"
          # The app is built unless every file is one it never reads.
          if grep -qvE '\.md$|^LICENSE$|^\.gitignore$|^\.claude/|^measure\.sh$' <<< "$files"; then app=true; else app=false; fi
          if grep -qE '^\.claude/hooks/|\.sh$|^\.github/workflows/ci\.yml$' <<< "$files"; then hooks=true; else hooks=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "hooks=$hooks" >> "$GITHUB_OUTPUT"

  # Timeouts sit on steps, not jobs: a job timeout also counts the wait for a
  # macOS runner, and a long queue cancelled builds before they started.
  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build universal app
        timeout-minutes: 10
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then export VERSION=${GITHUB_REF_NAME#v}; fi
          ./build.sh
      - name: Check both architectures
        run: lipo "$HOME/Applications/Decaffeinate.app/Contents/MacOS/Decaffeinate" -verify_arch arm64 x86_64
      - name: Self-test
        timeout-minutes: 2 # a hang (e.g. a blocked pipe in run()) fails fast
        run: '"$HOME/Applications/Decaffeinate.app/Contents/MacOS/Decaffeinate" --selftest'
      - name: Lint watchdog plist
        run: plutil -lint io.github.dstmrk.decaffeinate.watchdog.plist
      - name: Package dmg
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        env:
          DMG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dmgbuild==1.6.5
          APP="$HOME/Applications/Decaffeinate.app"
          swift assets/render-dmg-background.swift "$RUNNER_TEMP/background.tiff"
          "$RUNNER_TEMP/venv/bin/dmgbuild" -s assets/dmg-settings.py \
            -D app="$APP" -D icon="$APP/Contents/Resources/AppIcon.icns" -D background="$RUNNER_TEMP/background.tiff" \
            Decaffeinate "Decaffeinate-${DMG_VERSION#v}.dmg"
      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: Decaffeinate-*.dmg
          if-no-files-found: error

  hook-tests:
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hook test suites
        timeout-minutes: 5
        run: |
          bash .claude/hooks/test-block-push-to-main.sh
          bash .claude/hooks/test-block-commit-on-main.sh
      - name: ShellCheck
        run: shellcheck build.sh measure.sh .claude/hooks/*.sh

  # The only job with write access, and only on a tag after every check passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, hook-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
      - name: Publish GitHub Release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" Decaffeinate-*.dmg --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" Decaffeinate-*.dmg --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
